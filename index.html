<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronita's Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="intro-page">
        <section class="polaroid-page">
            <div class="polaroid">
                <span class="branch branch-top"></span>
                <span class="branch branch-bottom"></span>

                <span class="leaf leaf-one"></span>
                <span class="leaf leaf-two"></span>
                <span class="leaf leaf-three"></span>
                <span class="leaf leaf-four"></span>

                <span class="flower flower-one">*</span>
                <span class="flower flower-two">*</span>
                <span class="flower flower-three">*</span>

                <img class="polaroid-img" src="1590.jpg" alt="Pronita">
                <p>little me</p>
            </div>

            <div class="intro-text">
                <p>
                    Hi! Welcome to my world. I am Pronita, a double majoring student at UAM.
                </p>
            </div>
        </section>

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

        <h1 id="main-title">
            <span class="title-left">Pronita's</span>
            <span class="title-right">Portfolio</span>
        </h1>
    </section>

    <section class="scrapbook-menu" id="scrapbook-menu">
        <h2>open a scrapbook page</h2>

        <div class="menu-boxes">
            <button>Projects</button>
            <button>Achievements</button>
            <button>Goals</button>
            <button>Hobbies</button>
            <button>Research</button>
            <button>Hackathons</button>
        </div>
    </section>

    <div class="cursor-dot"></div>

    <button class="toggle">
        <span class="sun-icon">☀</span>
        <span class="moon-icon">☾</span>
        <span class="toggle-knob"></span>
    </button>

    <script src="script.js"></script>
</body>
</html>
